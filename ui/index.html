<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- img-src keeps https: on purpose: the artwork picker shows SteamGridDB thumbnails and the news show their photos straight from the web
       (the user is browsing). Library artwork from Steam, Epic and SteamGridDB is served by art.megahub, a cache that holds nothing else.
       A skin cannot use that to call a stranger's server: its stylesheet is cleaned of external addresses where local.megahub serves it
       (see SkinCss.cs). Videos: our own host and Steam's trailer CDN only. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://local.megahub; font-src 'self' https://local.megahub; media-src 'self' https://local.megahub https://*.steamstatic.com https://*.steampowered.com https://*.akamaihd.net; script-src 'self'">
  <title>Mega Hub</title>
  <link rel="icon" href="assets/mega-hub-icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" id="skin-css">
</head>
<body>
  <div id="bg">
    <div id="bg-theme" aria-hidden="true"></div>
    <div class="bg-layer"></div>
    <div class="bg-layer"></div>
    <div id="bg-hero" aria-hidden="true"></div>
    <div class="bg-ambient"></div>
    <div class="bg-shade"></div>
  </div>

  <!-- The tab bar: this header becomes the host of a closed shadow root shown in the top layer (core/tab-bar.js); only the status area stays
       here, slotted into it. #top-gap keeps the room of the bar free in the page flow. -->
  <header id="top" popover="manual">
    <div id="status">
      <span id="session-status" hidden></span>
      <span id="parental-status" hidden></span>
      <span id="downloads-status" hidden></span>
      <span id="weather" hidden></span>
      <span id="pad-status" title="Controller" data-i18n-title="index.pad"></span>
      <time id="clock"></time>
    </div>
  </header>
  <div id="top-gap" aria-hidden="true"></div>

  <main id="view"></main>

  <footer id="hints"></footer>

  <aside id="quick" data-i18n-aria="index.guideMenu"></aside>

  <div id="overlay" hidden>
    <div class="dialog">
      <h2 class="dialog-title"></h2>
      <p class="dialog-text" hidden></p>
      <ul class="menu"></ul>
    </div>
  </div>

  <div id="toast" hidden></div>
  <div id="shot-toast" role="status" hidden></div>

  <div id="boot" aria-hidden="true" data-scene="orbital">
    <div class="boot-logo">Mega<span> Hub</span></div>
    <!-- The animated loading scenes (look-prefs.js picks one with data-scene; "classic" is the picture with the bar below). -->
    <div class="boot-scenes">
      <div class="bs-scene bs-orbital"><div class="bs-orbit"></div><div class="bs-orbit bs-o2"></div><div class="bs-orbit bs-o3"></div><div class="bs-brand">MEGA HUB</div></div>
      <div class="bs-scene bs-horizon"><div class="bs-gridfloor"></div><div class="bs-scan"></div><div class="bs-brand">MEGA HUB</div><div class="bs-progress"><span></span></div></div>
      <div class="bs-scene bs-core"><div class="bs-energy"></div><div class="bs-hex"></div><div class="bs-brand">MEGA HUB</div><div class="bs-particles"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="bs-scene bs-pulse"><div class="bs-particles"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="bs-bars"><i></i><i></i><i></i><i></i><i></i></div><div class="bs-brand">MEGA HUB</div><div class="bs-progress"><span></span></div></div>
    </div>
    <div class="boot-bar"><div></div></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
